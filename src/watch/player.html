<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>延河回放助手</title><link rel="stylesheet" href="player.css"><link rel="stylesheet" href="lyrics.css"><link rel="stylesheet" href="player-controls.css"></head>
<body>
  <header class="topbar"><div class="brand"><img src="icons/32.png" width="30" height="30" alt=""><strong>延河回放助手</strong></div><a id="site-link" href="https://aita.yanhekt.cn/" target="_blank" rel="noreferrer">延河课堂 / 登录</a></header>
  <main>
    <form id="course-form" class="course-form"><label for="course-input">课程链接或 ID</label><select id="platform" aria-label="课程平台"><option value="modern">新版</option><option value="legacy">旧版</option></select><div class="input-row"><input id="course-input" type="text" autocomplete="off" spellcheck="false" placeholder="课程链接或 ID"><button id="load-course" class="primary" type="submit">读取课程</button></div></form>
    <div id="message" class="notice" role="status" aria-live="polite"></div>
    <section class="course-heading"><div><h1 id="course-title">课程回放</h1><p id="course-meta"></p></div><span id="connection" class="connection">尚未连接</span></section>
    <div class="workspace">
      <aside class="lecture-pane" id="lecture-pane" aria-label="课程课次"><div class="pane-heading"><h2>课程课次</h2><span id="replay-count">—</span><button id="refresh-list" type="button" class="text-button" title="刷新课程列表" aria-label="刷新课程列表">刷新</button></div><div class="lecture-filters" aria-label="课次类型"><button id="filter-replay" type="button" aria-pressed="true">回放</button><button id="filter-live" type="button" aria-pressed="false">直播</button></div><div id="lecture-list" class="lecture-list"><p class="empty">暂无课程</p></div></aside>
      <section class="watch-pane" aria-label="视频播放器">
        <div class="watch-heading"><h2 id="lecture-title">尚未选择课次</h2><div class="pane-tools"><span id="duration"></span><button id="download-video" class="text-button" type="button" disabled>下载视频</button><button id="toggle-lectures" class="text-button" type="button" aria-pressed="true" aria-expanded="true" aria-controls="lecture-pane">隐藏课次</button><button id="toggle-subtitles" class="text-button" type="button" aria-pressed="true" aria-expanded="true" aria-controls="transcript-pane">隐藏字幕</button></div></div>
        <div id="media-grid" class="media-grid" tabindex="0" aria-label="课程播放器，空格播放暂停，方向键快进后退">
          <div class="stage"><video id="video" muted playsinline preload="none" aria-label="课程视频"></video><div id="stage-empty" class="stage-empty"><div class="play-symbol" aria-hidden="true">▷</div><h3 id="stage-label">选择课次</h3><p id="stage-detail"></p><button id="play" class="primary" type="button" disabled>播放回放</button></div></div>
          <div id="secondary-stage" class="stage secondary-stage" hidden><video id="secondary-video" playsinline muted preload="none" aria-label="副画面"></video><span id="secondary-label" class="view-label"></span></div>
          <div id="tertiary-stage" class="stage secondary-stage" hidden><video id="tertiary-video" playsinline muted preload="none" aria-label="第三画面"></video><span id="tertiary-label" class="view-label"></span></div><video id="audio-video" hidden playsinline muted preload="none" aria-hidden="true"></video>
          <div id="player-controls" class="player-controls">
            <span id="control-sign-in" class="control-sign-in" hidden>签到模式</span>
            <div id="menu-speed" class="control-menu" hidden aria-label="播放速度"><h3>播放速度</h3><label class="speed-label" for="speed"><span class="sr-only">倍速</span><select id="speed" aria-label="倍速"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div>
            <div id="menu-settings" class="control-menu" hidden aria-label="播放设置">
            <div class="setting-section">
              <h3>画面来源</h3><fieldset class="view-switch"><legend class="sr-only">主画面来源</legend><button id="screen" class="view-button" type="button" disabled aria-pressed="false">屏幕画面</button><button id="classroom" class="view-button" type="button" disabled aria-pressed="false">教室画面</button><button id="student" class="view-button" type="button" disabled hidden aria-pressed="false">学生画面</button></fieldset>
              <label id="secondary-view-label" class="audio-label" hidden>副画面 <select id="secondary-view" aria-label="副画面来源"><option value="screen">屏幕</option><option value="classroom">教室/主画面</option><option value="student">学生</option></select></label>
            </div>

              <div class="setting-section"><h3>声音与字幕</h3><label id="audio-label" class="audio-label" hidden>声音来源 <select id="audio-source" aria-label="声音来源"><option value="auto">自动检测音轨</option><option value="current">当前画面</option><option value="screen">屏幕</option><option value="classroom">教室</option><option value="student">学生</option><option value="muted">静音</option></select></label><p id="audio-status" class="audio-status" role="status" aria-live="polite"></p><input id="show-captions" type="checkbox" checked disabled hidden></div>
              <div class="setting-section"><h3>观看选项</h3><div class="settings-actions"><button id="picture-in-picture" class="text-button" type="button" aria-label="画中画（主画面）" title="画中画（主画面）" disabled>画中画（主画面）</button><button id="retry" class="text-button" type="button" disabled>重新连接</button><button id="timely-mode" class="live-button timely-button" type="button" hidden aria-pressed="false" title="显示最新缓存帧，声音连续播放">签到模式</button></div><span id="timely-status" class="timely-status" hidden></span></div>
              <details id="live-platform-tools" class="live-platform-tools" hidden><summary>直播平台切换 · <span id="active-live-platform"></span></summary><p id="live-platform-status" role="status"></p><div class="input-row"><select id="live-course-candidate" aria-label="另一平台的课程候选" hidden></select><button id="switch-live-platform" type="button" class="text-button" disabled>切换直播平台</button></div><form id="link-live-form"><label for="alternate-live-url">关联另一站的课程或直播</label><div class="input-row"><input id="alternate-live-url" type="url" placeholder="粘贴旧站或新站链接" required><button type="submit" class="text-button">关联并切换</button></div></form><button id="copy-playback-diagnostics" type="button" class="text-button">复制声音诊断</button><textarea id="playback-diagnostics" aria-label="声音诊断内容" readonly hidden></textarea><p id="diagnostics-status" role="status"></p></details>
            </div>
            <div class="player-control-dock"><div id="control-progress" class="control-progress"><input id="control-seek" aria-label="播放进度" type="range" min="0" max="1000" step="1" value="0" disabled></div>
              <div class="player-control-row" role="group" aria-label="播放控制">
                <button id="control-play" class="control-icon" type="button" aria-label="播放" title="播放（空格）" disabled></button><time id="control-time" class="control-time">0:00 / 0:00</time><button id="go-live" type="button" hidden disabled title="回到最新直播位置">回到直播</button><span class="control-spacer"></span>
                <button id="control-speed" class="control-text" type="button" aria-label="倍速" title="倍速" aria-controls="menu-speed" aria-expanded="false">倍速</button>
                <button id="control-captions" class="control-text" type="button" aria-label="视频字幕" title="视频内字幕" aria-pressed="true" disabled>字幕</button><div id="volume-area" class="volume-area"><button id="control-volume" class="control-icon" type="button" aria-label="静音" title="静音（M）" aria-controls="menu-volume" aria-expanded="false"></button><div id="menu-volume" class="control-menu volume-menu" hidden aria-label="音量设置"><label id="volume-label" hidden><span class="sr-only">音量</span><input id="audio-volume" aria-label="音量" type="range" min="0" max="100" value="100"><output id="volume-value">100%</output></label></div></div>
                <button id="control-settings" class="control-icon" type="button" aria-label="播放设置" title="播放设置" aria-controls="menu-settings" aria-expanded="false"></button>
                <button id="triple" class="control-icon" type="button" hidden disabled aria-label="三画面" title="三画面（仅直播）" aria-pressed="false"></button><button id="dual" class="control-icon" type="button" disabled aria-label="双画面" title="双画面" aria-pressed="false"></button><button id="browser-fullscreen" class="control-icon" type="button" aria-label="网页全屏" title="网页全屏" aria-pressed="false"><span data-control-label class="sr-only">网页全屏</span></button><button id="display-fullscreen" class="control-icon" type="button" aria-label="屏幕全屏" title="屏幕全屏" aria-pressed="false"><span data-control-label class="sr-only">屏幕全屏</span></button>
              </div>
            </div>
          </div>
        </div>
        <div id="playback-status" class="playback-status" role="status" aria-live="polite">等待选择课次</div>
      </section>
      <aside class="transcript-pane" id="transcript-pane" aria-label="平台字幕">
        <div class="transcript-content">
          <div class="pane-heading"><h2>平台字幕</h2><span id="subtitle-count">—</span></div>
          <label class="sr-only" for="subtitle-search">搜索字幕</label>
          <input id="subtitle-search" type="search" placeholder="搜索字幕" disabled>
          <details id="subtitle-calibration" class="subtitle-calibration">
            <summary>字幕时间校准 <output id="offset-summary">未偏移</output></summary>
            <form id="offset-form"><fieldset id="offset-controls" disabled>
              <label for="subtitle-offset">偏移秒数（＋延后 / −提前）</label>
              <div class="offset-input-row"><input id="subtitle-offset" type="number" min="-86400" max="86400" step="0.001" value="0" required><button class="offset-apply" type="submit">应用</button></div>
              <div class="offset-actions"><button type="button" data-offset-step="-0.5">提前 0.5 秒</button><button type="button" data-offset-step="0.5">延后 0.5 秒</button><button id="offset-reset" type="button">重置</button></div>
              <button id="align-current" type="button" title="将对应字幕对齐到当前播放位置" aria-pressed="false" disabled>选句对齐</button><button id="cancel-align" type="button" hidden>取消</button>
            </fieldset></form>
            <p id="calibration-status" role="status"></p>
          </details>
          <div class="subtitle-mode-row"><span id="subtitle-mode">随播放滚动</span><time id="subtitle-time" aria-label="当前播放时间">0:00</time><button id="return-sync" class="text-button" type="button" hidden>回到当前句</button></div>
          <p id="current-caption" class="subtitle-gap" role="status"></p>
          <div class="lyrics-viewport"><div id="subtitle-list" class="subtitle-list" tabindex="0" role="region" aria-label="歌词式字幕列表"><p class="empty">暂无字幕</p></div></div>
        </div>
      </aside>
    </div>
    <footer>延河回放助手 0.10.0</footer>
  </main>
  <script src="vendor/md5.min.js"></script><script src="vendor/hls.min.js"></script><script src="vendor/mpegts.min.js"></script><script type="module" src="player.js"></script>
</body></html>
